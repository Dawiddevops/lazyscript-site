<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LazyScript Publisher — TikTok Integration</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; max-width: 720px; margin: 0 auto; padding: 48px 24px; line-height: 1.6; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 32px; margin-top: 24px; }
    h1 { color: #10b981; margin-bottom: 8px; }
    .btn { display: inline-block; background: #10b981; color: #06281e; font-weight: 700; padding: 12px 22px; border-radius: 10px; text-decoration: none; border: none; cursor: pointer; font-size: 1rem; }
    .status { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; margin-top: 16px; font-family: monospace; font-size: 0.9rem; word-break: break-all; }
    a { color: #10b981; }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Back to LazyScript</a></p>
  <div class="card">
    <h1>LazyScript Publisher</h1>
    <p>Connect your TikTok creator account to publish original educational shorts directly from the LazyScript pipeline.</p>
    <p><a id="authBtn" class="btn" href="#">Connect with TikTok</a></p>
    <div id="statusBox" class="status">Status: Ready to connect TikTok (Sandbox / Production).</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error");
    const statusBox = document.getElementById("statusBox");
    const redirectUri = window.location.origin + window.location.pathname;
    const authUrl = "https://www.tiktok.com/v2/auth/authorize/"
      + "?client_key=sbawf8zgqs7n1h3fsi"
      + "&scope=" + encodeURIComponent("user.info.basic,video.upload,video.publish")
      + "&response_type=code"
      + "&redirect_uri=" + encodeURIComponent(redirectUri)
      + "&state=lazyscript_web";
    document.getElementById("authBtn").href = authUrl;

    if (code) {
      statusBox.textContent = "Status: TikTok account authorized! Code received (" + code.slice(0, 14) + "...). Ready for Content Posting API upload.";
      statusBox.style.borderColor = "#10b981";
    } else if (err) {
      statusBox.textContent = "Status: Authorization error — " + err;
    }
  </script>
</body>
</html>
